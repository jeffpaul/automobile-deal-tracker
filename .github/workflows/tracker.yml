name: PHEV/4xe tracker

on:
  schedule:
    # 6am Central (CDT = UTC-5; CST = UTC-6 → 5am CST) — ready before the day starts
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The database lives in git (committed at the end of every run), so the
      # checkout above already has the latest copy — no Actions cache needed.

      - name: Run tracker
        env:
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Optional repository variables (Settings → Secrets and variables →
          # Actions → Variables). Unset = defaults in tracker/config.py.
          MC_MAX_ROWS: ${{ vars.MC_MAX_ROWS }}        # 500 on MarketCheck's Free plan
          MC_MAX_MILES: ${{ vars.MC_MAX_MILES }}
          CARFAX_ENABLED: ${{ vars.CARFAX_ENABLED }}  # "true" to re-enable Apify CARFAX
        run: python -m tracker.main

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.db
          git diff --staged --quiet || git commit -m "chore: update listings db [skip ci]"
          git pull --rebase origin trunk
          git push
